name: Keep Supabase alive

# Supabase pausa proyectos free sin actividad "suficiente" de base de datos
# durante 7 días seguidos. Según la doc oficial, esperan más o menos unas
# pocas requests por día en la última semana, no solo un ping cada tanto.
# Este workflow le pega a una tabla de lectura pública (badges, que tiene
# RLS "Anyone can view badges") todos los días para asegurar esa cadencia.

on:
  schedule:
    - cron: "0 9 * * *" # todos los días, 9:00 UTC
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/badges?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Respuesta de Supabase: $STATUS"
          if [ "$STATUS" -ge 400 ]; then
            echo "Supabase respondió con error $STATUS"
            exit 1
          fi
